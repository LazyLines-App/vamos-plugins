<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vamos page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--ground:#FAFAFA;--card:#FFFFFF;--ink:#171717;--ink2:#3F3F46;--muted:#71717A;--hair:#E4E4E7;--hair2:#D4D4D8;--track:#F4F4F5;--orange:#FF521D;--on-orange:#171717;--sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--pixel:"Geist Pixel","Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0F0F0F;--card:#1A1A1A;--ink:#F5F5F5;--ink2:#D4D4D8;--muted:#A1A1AA;--hair:#2A2A2A;--hair2:#3F3F46;--track:#242424;color-scheme:dark}}
:root[data-theme="dark"]{--ground:#0F0F0F;--card:#1A1A1A;--ink:#F5F5F5;--ink2:#D4D4D8;--muted:#A1A1AA;--hair:#2A2A2A;--hair2:#3F3F46;--track:#242424;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
p{margin:0}
h1,h2,h3,h4{margin:0}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:6px}
.px{font-family:var(--pixel);font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums}
.xs{font-family:var(--sans);font-weight:500;margin-left:.04em}
.pre #app{visibility:hidden}
.shell{max-width:992px;margin:0 auto;padding:0 16px 40px}
@media (min-width:1100px){.shell{max-width:none;display:grid;grid-template-columns:168px minmax(0,960px);column-gap:48px;justify-content:center;padding:0 32px 64px}.shell>.nav{grid-column:1;grid-row:1/span 3;position:sticky;top:44px;align-self:start;margin-top:74px}.shell>.hero,.shell>main,.shell>footer{grid-column:2}}
/* hero */
.hero{padding:60px 0 6px;min-width:0}
h1{font-weight:600;font-size:clamp(38px,6.6vw,68px);line-height:1.03;letter-spacing:-.032em}
h1 .l1,h1 .l2{display:block}
h1 .l2{font-family:var(--pixel);font-weight:400;letter-spacing:-.021em;color:var(--orange);-webkit-text-stroke:.017em var(--orange);margin-top:.08em}
h1 .w{display:inline-block}
.lede{margin-top:20px;max-width:60ch;color:var(--ink2);font-size:17px}
.ctrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:40px}
.ctr .n{display:block;font-size:clamp(34px,4.4vw,48px);line-height:1;white-space:nowrap}
.ctr .n.acc{color:var(--orange)}
.ctr .lab{display:block;margin-top:10px;color:var(--muted);font-size:14px;line-height:1.35}
@media (max-width:640px){.hero{padding-top:34px}.ctrs{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px;margin-top:30px}.lede{font-size:16px}}
/* nav */
.nav{margin:30px -16px 0;position:sticky;top:0;z-index:5;background:var(--ground);border-bottom:1px solid var(--hair)}
.nav ol{list-style:none;margin:0;padding:0 16px;display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.nav ol::-webkit-scrollbar{display:none}
.nav a{display:flex;gap:8px;align-items:baseline;padding:13px 0;color:var(--muted);font-size:14px;font-weight:500}
.nav .k{font-family:var(--pixel);color:var(--orange);font-weight:400}
.nav a.on{color:var(--ink);font-weight:600}
@media (min-width:1100px){.nav{margin:74px 0 0;border:0;background:none}.nav ol{display:block;padding:0}.nav a{padding:7px 0;font-size:14.5px;white-space:normal}}
/* sections */
main{display:grid;gap:20px;margin-top:32px;min-width:0}
.sec{background:var(--card);border:1px solid var(--hair);border-radius:24px;padding:32px;scroll-margin-top:64px;min-width:0}
.sec>h2{display:flex;gap:14px;align-items:baseline;font-size:26px;line-height:1.2;letter-spacing:-.02em;font-weight:600;margin-bottom:6px}
.sec>h2 .k{font-family:var(--pixel);color:var(--orange);font-weight:400}
.sub{color:var(--muted);font-size:15px;max-width:72ch}
.body{margin-top:24px;min-width:0}
.note{color:var(--muted);font-size:14px;margin-top:20px;max-width:72ch}
@media (max-width:640px){.sec{padding:22px 18px}.sec>h2{font-size:22px;gap:10px}.body{margin-top:18px}}
/* post card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.pc{display:flex;flex-direction:column;gap:8px;min-width:0}
.th{position:relative;display:block;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:var(--track)}
.th img,.th video{width:100%;height:100%;object-fit:cover}
.th.none{display:flex;align-items:flex-end;padding:14px;border:1px solid var(--hair);background:var(--card)}
.rr .th.none,.wr .th.none{padding:0;background:var(--hair)}.rr .th.none .tx,.wr .th.none .tx{display:none}
.th.none .tx{font-weight:500;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.allnone .th{aspect-ratio:3/1;align-items:center;padding-left:74px}
.bx{position:absolute;left:8px;top:8px;z-index:1;font-family:var(--pixel);font-size:15px;line-height:1;padding:5px 6px 4px;border-radius:4px;background:var(--card);color:var(--ink);border:1px solid var(--hair);white-space:nowrap}
.bx.win{background:var(--orange);color:var(--on-orange);border-color:var(--orange)}
.bx .xs{font-size:.9em}
.inl .bx,.bx.inl{position:static;display:inline-block}
.who{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;min-width:0}
.who .hd{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:20px;height:20px;border-radius:50%;flex:none;object-fit:cover;background:var(--track)}
.meta{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .px{color:var(--ink);font-size:14px}
a.pc:hover .hd{text-decoration:underline;text-underline-offset:3px}
.watch{font-size:13px;font-weight:500;color:var(--ink)}
/* format card */
.fc{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;padding:28px 0;border-top:1px solid var(--hair)}
.fc:first-child{border-top:0;padding-top:0}
.fc:last-child{padding-bottom:0}
.fc-top{display:flex;gap:12px;align-items:baseline;color:var(--muted);font-size:14px}
.fc-top .rank{font-family:var(--pixel);color:var(--ink);font-size:17px}
.stg{font-size:12.5px;line-height:1;padding:4px 8px;border:1px solid var(--hair2);border-radius:999px;color:var(--ink2)}
.stg.up{color:var(--orange);border-color:var(--orange)}
.fc h3{margin:6px 0 6px;font-size:23px;line-height:1.2;letter-spacing:-.02em;font-weight:600}
.about{color:var(--ink2);font-size:15.5px}
.stat{margin-top:16px;font-size:15px;color:var(--ink2)}
.stat .n{font-size:32px;line-height:1;margin-right:8px;color:var(--ink);vertical-align:-4px}
.lib{margin-top:6px;font-size:14px;color:var(--muted)}
.lib .px{color:var(--ink)}
.beats{margin:18px 0 0;padding:0;list-style:none;counter-reset:b;display:grid;gap:9px}
.beats li{counter-increment:b;display:grid;grid-template-columns:26px minmax(0,1fr);font-size:15px;line-height:1.45}
.beats li::before{content:counter(b);font-family:var(--pixel);color:var(--muted);font-size:15px}
.film,.yours{margin-top:14px;font-size:15px;line-height:1.5;color:var(--ink2)}
.film b,.yours b{color:var(--ink);font-weight:600;margin-right:6px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.strip .who{font-size:13px}
.strip .meta{font-size:12.5px}
.strip .meta .px{font-size:13px}
.strip .th{border-radius:12px}
.strip .bx{font-size:13px;left:6px;top:6px}
@media (max-width:860px){.fc{grid-template-columns:minmax(0,1fr);gap:20px}}
/* hook rows */
.hhead,.hr{display:grid;grid-template-columns:46px minmax(0,1.1fr) 104px minmax(0,1fr);gap:20px}
.hhead{color:var(--muted);font-size:13.5px;padding-bottom:10px}
.hr{align-items:start;padding:16px 0;border-top:1px solid var(--hair)}
.hr-th{display:block;width:46px;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--track)}
.hr-th img{width:100%;height:100%;object-fit:cover}
.q{font-size:16.5px;font-weight:500;line-height:1.4}
.shape{color:var(--muted);font-size:14px;margin-top:5px}
.hr-num{display:flex;flex-direction:column;gap:7px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.hr-num .px{color:var(--ink);font-size:14px}
.hr-you p{font-size:16.5px;line-height:1.4}
.hr-you .lab{display:none}
@media (max-width:720px){.hhead{display:none}.hr{grid-template-columns:46px minmax(0,1fr);gap:12px 14px}.hr-num{grid-column:2;flex-direction:row;align-items:center;gap:10px}.hr-you{grid-column:1/-1;background:var(--track);border-radius:12px;padding:12px 14px}.hr-you .lab{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}}
/* rows: who, ranked, lessons, week */
.wr{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:20px;align-items:center;padding:16px 0;border-top:1px solid var(--hair)}
.wr:first-child{border-top:0;padding-top:0}
.wr .th{border-radius:8px}
.wr h4{font-size:17.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.wr p{color:var(--ink2);font-size:15px;margin-top:3px}
.num{text-align:right;white-space:nowrap;font-size:13px;color:var(--muted)}
.num .px{display:block;font-size:22px;color:var(--ink);line-height:1.1}
@media (max-width:640px){.wr{grid-template-columns:52px minmax(0,1fr);gap:6px 14px;align-items:start}.wr .num{grid-column:2;text-align:left;display:flex;gap:6px;align-items:baseline}.wr .num .px{display:inline;font-size:17px}.wr>a{grid-row:span 2}}
.rr{display:grid;grid-template-columns:30px 40px minmax(0,1fr) 100px 72px 60px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--hair);font-size:15px}
.rr:first-child{border-top:0;padding-top:0}
.rr .i{color:var(--muted)}
.rr .th{border-radius:6px}
.rr .cap{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .v{text-align:right}
.rr .d{color:var(--muted);text-align:right;font-size:14px}
@media (max-width:640px){.rr{grid-template-columns:22px 36px minmax(0,1fr) auto;gap:10px}.rr .v{grid-column:3;grid-row:2;text-align:left;font-size:14px;margin-top:-6px}.rr .d{display:none}.rr .x{grid-row:1/span 2;grid-column:4}.rr .i,.rr .th{grid-row:1/span 2}}
.les,.week{list-style:none;margin:0;padding:0}
.les li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;padding:15px 0;border-top:1px solid var(--hair)}
.les li:first-child{border-top:0;padding-top:0}
.les .st{font-size:14.5px;font-weight:600}
.les .st.testing{color:var(--muted);font-weight:500}
.les .l{font-weight:500;font-size:16px}
.les .e{color:var(--muted);font-size:14.5px;margin-top:3px}
@media (max-width:520px){.les li{grid-template-columns:minmax(0,1fr);gap:4px}}
.week li{display:grid;grid-template-columns:22px 64px minmax(0,1fr);gap:14px;align-items:baseline;padding:13px 0;border-top:1px solid var(--hair)}
.week li:first-child{border-top:0;padding-top:0}
.box{width:18px;height:18px;border:1.5px solid var(--hair2);border-radius:5px;background:none;padding:0;cursor:pointer;transform:translateY(3px);position:relative}
.done>.box,.week .done .box{background:var(--ink);border-color:var(--ink)}
.done>.box::after,.week .done .box::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid var(--ground);border-width:0 2px 2px 0;transform:rotate(45deg)}
.week .day{color:var(--muted);font-size:14px;font-weight:500}
@media (max-width:520px){.week li{grid-template-columns:22px 36px minmax(0,1fr);gap:12px}}
.week .done .t{color:var(--muted);text-decoration:line-through}
code{font-family:var(--mono);font-size:.9em;background:var(--track);border-radius:6px;padding:2px 6px;white-space:nowrap}
/* next post */
.nextp{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px;align-items:start}
.nextp h3{font-size:25px;line-height:1.22;letter-spacing:-.02em;font-weight:600}
.nextp .why{color:var(--ink2);margin-top:12px;font-size:16px;max-width:58ch}
.nextp .say{margin-top:20px;padding-top:16px;border-top:1px solid var(--hair);font-size:15.5px}
.nextp .say span{display:block;color:var(--muted);font-size:13.5px;margin-bottom:3px}
@media (max-width:640px){.nextp{grid-template-columns:118px minmax(0,1fr);gap:14px 16px}.nextp>div{display:contents}.nextp h3{grid-column:2;grid-row:1;align-self:center;font-size:20px}.nextp .why,.nextp .beats,.nextp .say{grid-column:1/-1;margin-top:0}.nextp .why{font-size:15px}.nextp .meta{white-space:normal}}
/* plays (playbook) */
.plays{display:grid;gap:14px}
.play{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:0 28px;border:1px solid var(--hair);border-radius:16px;padding:22px 24px;min-width:0}
.play>*{grid-column:1;min-width:0}
.pl-top{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:14px;font-weight:500}
.pl-top .k{font-family:var(--pixel);color:var(--orange);font-size:16px;font-weight:400}
.play h3{font-size:21px;line-height:1.28;letter-spacing:-.015em;font-weight:600;margin-top:6px}
.pl-parts{margin:16px 0 0;display:grid;gap:9px}
.pl-parts div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;font-size:15px;line-height:1.45}
.pl-parts dt{color:var(--muted);font-weight:500}
.pl-parts dd{margin:0;color:var(--ink2)}
.pl-line{margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.pl-line span,.pl-paste .lb{display:block;color:var(--muted);font-size:13.5px;margin-bottom:4px}
.pl-line p{font-size:17px;font-weight:500;line-height:1.4}
.pl-paste{margin-top:14px;background:var(--track);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:end}
.pl-paste .lb{grid-column:1/-1;margin:0}
.pl-paste p{font-family:var(--mono);font-size:13.5px;line-height:1.5;color:var(--ink2);white-space:pre-wrap;overflow-wrap:anywhere}
.play .pl-post{grid-column:2;grid-row:1/span 5;align-self:start}
.pl-skip{margin-top:22px}
.pl-skip h4{font-size:15px;font-weight:600}
.pl-skip ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.pl-skip li{font-size:15px;color:var(--ink2);line-height:1.45}
.pl-skip li b{color:var(--ink);font-weight:500}
@media (max-width:640px){.play{grid-template-columns:minmax(0,1fr) 64px;gap:0 14px;padding:18px}.play h3{font-size:18px}.play .pl-post{grid-row:1/span 2}.play .pl-post .who,.play .pl-post .meta,.play .pl-post .bx{display:none}.play .pl-post .th{border-radius:8px}.play .pl-post .th.none{padding:0;background:var(--hair)}.play .pl-post .th.none .tx{display:none}.pl-parts,.pl-line,.pl-paste{grid-column:1/-1}.pl-parts div{grid-template-columns:52px minmax(0,1fr);gap:10px;font-size:14.5px}.pl-paste{grid-template-columns:minmax(0,1fr)}.pl-paste .btn{justify-self:start;margin-top:8px}}
/* setup */
.setg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sc{border:1px solid var(--hair);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sc-h{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:14px;font-weight:500}
.sc-h .k{font-family:var(--pixel);color:var(--orange);font-size:16px;font-weight:400}
.sc .v{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.3}
.sc .dt{color:var(--ink2);font-size:15px}
.sc blockquote{margin:0;font-size:15.5px;line-height:1.45;padding-left:12px;border-left:2px solid var(--hair2)}
.avs{display:flex;flex-wrap:wrap;gap:9px 16px}
.avs a{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;min-width:0}
.avs .f{color:var(--muted);font-weight:400;font-size:13px}
.sc .chg{margin-top:auto;padding-top:8px;color:var(--muted);font-size:14px}
.sc .chg q{color:var(--ink)}
.sc .lk{font-weight:500;text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.setg{grid-template-columns:minmax(0,1fr)}}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sk{border:1px solid var(--hair);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;color:var(--muted);min-width:0}
.sk-top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px}
.sk-top .n{font-size:16px}
.sk .c{font-family:var(--mono);font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk p{font-size:14.5px;line-height:1.4}
.sk.s-done{color:var(--ink2)}
.sk.s-done .st{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:500}
.sk.s-done .box{width:16px;height:16px;transform:none;cursor:default;background:var(--ink);border-color:var(--ink)}
.sk.s-done .box::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid var(--ground);border-width:0 2px 2px 0;transform:rotate(45deg)}
.sk.s-next{border:1.5px solid var(--ink);color:var(--ink)}
.sk.s-next .c{color:var(--ink);font-weight:600}
.sk.s-next .st{color:var(--ink);font-weight:600}
@media (max-width:860px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.skills{grid-template-columns:minmax(0,1fr)}}
/* formats: toggle, matrix, sorter */
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:10px;padding:3px;gap:2px;margin-bottom:26px}
.seg button{border:0;background:none;font:500 14px var(--sans);color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.mx{display:grid;grid-template-columns:minmax(0,1.25fr) repeat(2,minmax(0,1fr));gap:10px}
.mx .h{font-size:14px;color:var(--muted);font-weight:500;padding:0 2px}
.mx .rn{display:flex;flex-direction:column;justify-content:center;font-weight:600;font-size:15.5px;line-height:1.3;padding:6px 2px;min-width:0}
.mx .rn small{font-weight:400;color:var(--muted);font-size:13.5px;margin-top:2px}
.cell{display:flex;gap:12px;align-items:center;border:1px solid var(--hair);border-radius:12px;padding:10px;min-height:92px;min-width:0}
.cell .th{width:40px;flex:none;border-radius:6px}
.cell .px{font-size:26px;line-height:1;display:block}
.cell .lb{color:var(--muted);font-size:13px;line-height:1.3;display:block;margin-top:3px}
.cell.gap{border:2px dotted var(--orange);justify-content:center;text-align:center;color:var(--ink2);font-size:14px;line-height:1.35;padding:10px 14px}
@media (max-width:640px){.mx{grid-template-columns:repeat(2,minmax(0,1fr))}.mx .h0{display:none}.mx .rn{grid-column:1/-1;padding:12px 2px 0}.cell{min-height:84px;gap:10px}.cell .th{width:34px}}
.sorter{position:relative;margin-top:40px}
.sorter .cv{position:absolute;left:0;top:0;border-radius:10px;overflow:hidden;transform-origin:0 0;background:var(--track)}
.sorter .cv img{width:100%;height:100%;object-fit:cover}
.sorter .rl{position:absolute;left:0;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:baseline;font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.01em}

<body>
<div class="shell" id="app"></div>
<script type="application/json" id="data">{"page":""}</script>
<script>
(function () {
'use strict';
var root = document.documentElement;
var D = {};
try { D = JSON.parse(document.getElementById('data').textContent || '{}'); } catch (e) { D = {}; }
var mq = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
var reduced = !!(mq && mq.matches);
var still = reduced || /(^|#)still\b/.test(location.hash);
var END = 3.4;
if (!still) root.classList.add('pre');

/* helpers */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v, d) { return Number(v).toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
// a handle as shown: one @, whether the run wrote it with one or not (a competitor written "@clickup" printed "@@clickup", 11-12)
function at(h) { return '@' + esc(String(h == null ? '' : h).replace(/^@+/, '')); }
function cx(n) { n = Number(n) || 0; if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M'; if (n >= 1e4) return Math.round(n / 1e3) + 'K'; if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K'; return String(n); }
function X(x) { return num(x, x < .095 ? 2 : 1) + '<span class="xs">×</span>'; }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dt(s, yr) { if (!s) return ''; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (!m) return esc(s); return (+m[3]) + '\u00a0' + MON[+m[2] - 1] + (yr ? '\u00a0' + m[1] : ''); }
function first(s) { return String(s || '').split('\n')[0]; }
function plat(p) { return ({ instagram: 'Instagram', tiktok: 'TikTok', youtube: 'YouTube', facebook_ad: 'the Ad Library' })[String(p || '').toLowerCase()] || 'the post'; }
function T(k, d) { return (D.titles && D.titles[k]) || d; }
function badge(x, cls) { if (x == null || x < 2) return ''; return '<span class="bx' + (x >= 5 ? ' win' : '') + (cls ? ' ' + cls : '') + '">' + X(x) + '</span>'; }
function link(u) { return u ? ' href="' + esc(u) + '" target="_blank" rel="noopener"' : ''; }
function img(src, cls) { return src ? '<img' + (cls ? ' class="' + cls + '"' : '') + ' src="' + esc(src) + '" alt="" loading="lazy" decoding="async">' : ''; }

/* components */
function thumb(p, noBadge) {
  var hook = first(p.hook || p.caption || '');
  if (p.thumbnail) return '<span class="th" data-hook="' + esc(hook) + '">' + img(p.thumbnail) + (noBadge ? '' : badge(p.x)) + '</span>';
  return '<span class="th none" data-hook="' + esc(hook) + '"><span class="tx">' + esc(hook) + '</span>' + (noBadge ? '' : badge(p.x)) + '</span>';
}
function post(p, anim) {
  return '<a class="pc"' + link(p.url) + (anim ? ' data-a="card"' : '') + '>' + thumb(p) +
    '<span class="who">' + img(p.avatar, 'av') + '<span class="hd">' + at(p.handle) + '</span></span>' +
    '<span class="meta">' + (p.views != null ? '<span class="px">' + cx(p.views) + '</span> views' : '') + (p.date ? ' · ' + dt(p.date) : '') + '</span></a>';
}
function grid(posts) {
  var none = posts.length && posts.every(function (p) { return !p.thumbnail; });
  return '<div class="grid' + (none ? ' allnone' : '') + '">' + posts.map(function (p) { return post(p, true); }).join('') + '</div>';
}
function example(e, lead) {
  var hook = first(e.hook || e.caption || '');
  var media;
  if (lead && e.video) media = '<span class="th" data-hook="' + esc(hook) + '"><video muted loop playsinline preload="none"' + (e.thumbnail ? ' poster="' + esc(e.thumbnail) + '"' : '') + ' data-src="' + esc(e.video) + '" data-plat="' + esc(plat(e.platform)) + '"></video>' + badge(e.x) + '</span>';
  else media = thumb(e);

  var meta = e.meta ? esc(e.meta) : '<span class="px">' + cx(e.views) + '</span> views';
  return '<a class="pc"' + link(e.url) + '>' + media + watch + '<span class="who">' + img(e.avatar, 'av') + '<span class="hd">' + at(e.handle) + '</span></span><span class="meta">' + meta + '</span></a>';

function fcard(f, i) {
  var where = f.where_label || (f.where === 'next_door' ? 'Next door' : 'In your niche');
  var stage = f.stage ? '<span class="stg' + (/^(early|trending)$/i.test(f.stage) ? ' up' : '') + '">' + esc(f.stage.charAt(0).toUpperCase() + f.stage.slice(1)) + '</span>' : '';
  var wins = num(f.creators_5x) + '</span>creators at 5<span class="xs">×</span> or more';
  var med = f.median_x ? 'Median <span class="px">' + X(f.median_x) + '</span> across ' + (f.examples_total ? num(f.examples_total) + ' examples in the library' : 'the library') : '';
  var stat = f.stat ? '<p class="stat">' + esc(f.stat) + '</p>'
    : !('niche_uses' in f) ? '<p class="stat"><span class="px n">' + wins + '</p>' + (med ? '<p class="lib">' + med + '</p>' : '')
    : (f.niche_uses == null ? '<p class="stat">Uses in your niche: not counted</p>' : '<p class="stat"><span class="px n">' + num(f.niche_uses) + '</span>' + (f.niche_uses == 1 ? 'post in your niche uses it' : 'posts in your niche use it') + '</p>') +
      '<p class="lib"><span class="px">' + wins.replace('</span>', '</span> ') + (med ? ' · ' + med : '') + '</p>';
  return '<article class="fc" data-a="card"><div class="fc-main"><div class="fc-top"><span class="rank">' + (i + 1) + '</span><span>' + esc(where) + '</span>' + stage + '</div>' +
    '<h3>' + esc(f.name) + '</h3><p class="about">' + esc(f.about) + '</p>' + stat +
    (f.beats && f.beats.length ? '<ol class="beats">' + f.beats.slice(0, 5).map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ol>' : '') +
    (f.film ? '<p class="film"><b>To film it</b>' + esc(f.film) + '</p>' : '') +
    (f.yours ? '<p class="yours"><b>Make it yours</b>' + esc(f.yours) + '</p>' : '') +
    '</div><div class="strip">' + (f.examples || []).slice(0, 3).map(function (e, j) { return example(e, j === 0); }).join('') + '</div></article>';
}
function hooks(list) {
  return '<div class="hhead"><span></span><span>Hook</span><span>Their post</span><span>Your version</span></div>' + list.map(function (h) {
    var p = h.post || {};
    return '<div class="hr" data-a="card"><a class="hr-th"' + link(p.url) + '>' + img(p.thumbnail) + '</a><div><p class="q">' + esc(h.hook) + '</p><p class="shape">' + esc(h.shape) + (p.handle ? ' · ' + at(p.handle) : '') + '</p></div>' +
      '<div class="hr-num">' + badge(p.x, 'inl') + (p.views != null ? '<span><span class="px">' + cx(p.views) + '</span> views</span>' : '') + '</div>' +
      '<div class="hr-you"><span class="lab">Your version</span><p>' + esc(h.yours) + '</p></div></div>';
  }).join('');
}
function nextPost(n) {
  if (!n) return '';
  return '<div class="nextp" data-a="card">' + (n.post ? post(n.post) : '<span></span>') + '<div><h3>' + esc(n.title) + '</h3>' + (n.why ? '<p class="why">' + esc(n.why) + '</p>' : '') +
    (n.steps && n.steps.length ? '<ol class="beats">' + n.steps.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ol>' : '') +
    (n.hook ? '<p class="say"><span>Open with</span>' + esc(n.hook) + '</p>' : '') + '</div></div>';
}
function week(list) {
  return '<ol class="week">' + list.map(function (w, i) {
    return '<li data-a="card" data-i="' + i + '"><button class="box" type="button" aria-label="Mark done"></button><span class="day">' + esc(w.day) + '</span><span class="t">' + esc(w.task) + (w.command ? ' <code>' + esc(w.command) + '</code>' : '') + '</span></li>';
  }).join('') + '</ol>';
}

function plays(list, skip) {
  var part = function (k, v) { return v ? '<div><dt>' + k + '</dt><dd>' + esc(v) + '</dd></div>' : ''; };
  return (list.length ? '<div class="plays">' + list.map(function (p, i) {
    return '<article class="play" data-a="card"><div class="pl-top"><span class="k">' + (i + 1) + '</span>Play</div><h3>' + esc(p.title) + '</h3>' +
      '<dl class="pl-parts">' + part('Seen', p.seen) + part('Work', p.work) + part('Watch', p.watch) + '</dl>' +
      (p.line ? '<div class="pl-line"><span>Your first line</span><p>' + esc(p.line) + '</p></div>' : '') +
      (p.paste ? '<div class="pl-paste"><span class="lb">Paste into Claude</span><p class="pl-prompt">' + esc(p.paste) + '</p><button class="btn" type="button">Copy the prompt</button></div>' : '') +

  }).join('') + '</div>' : '') +
    (skip && skip.length ? '<div class="pl-skip" data-a="card"><h4>Skip</h4><ul>' + skip.map(function (k) { return '<li><b>' + esc(k.line) + '</b>' + (k.why ? ' ' + esc(k.why) : '') + '</li>'; }).join('') + '</ul></div>' : '');
}

/* pages: each returns sections [{key,title,sub,html,note}] and an optional hero visual */
var heroExtra = '', pageAnim = null, after = null;
var P = {};
P.setup = function () {
  var s1 = '<div class="setg">' + (D.set || []).map(function (c, i) {
    var acc = c.accounts ? '<div class="avs">' + c.accounts.map(function (a) { return '<a' + link(a.url) + '>' + img(a.avatar, 'av') + at(a.handle) + (a.followers ? ' <span class="f"><span class="px">' + (isNaN(a.followers) ? esc(a.followers) : cx(a.followers)) + '</span></span>' : '') + '</a>'; }).join('') + '</div>' : '';
    var lines = (c.lines || []).map(function (l) { return '<blockquote>' + esc(l) + '</blockquote>'; }).join('');
    return '<div class="sc" data-a="card"><div class="sc-h"><span class="k">' + (i + 1) + '</span>' + esc(c.title) + '</div>' + (c.value ? '<p class="v">' + esc(c.value) + '</p>' : '') +
      (c.detail ? '<p class="dt">' + esc(c.detail) + '</p>' : '') + acc + lines + (c.link ? '<a class="lk"' + link(c.link.url) + '>' + esc(c.link.label) + ' ↗</a>' : '') +
      (c.change ? '<p class="chg">To change it, say: <q>' + esc(c.change) + '</q></p>' : '') + '</div>';

    return '<div class="sk s-' + esc(k.status || 'later') + '" data-a="card"><div class="sk-top"><span class="px n">' + (i + 1) + '</span>' + st + '</div><span class="c">' + esc(k.command) + '</span><p>' + esc(k.does) + '</p></div>';

  return [{ key: 'set', title: T('set', 'What’s set'), sub: D.set_sub, html: s1 }, { key: 'skills', title: T('skills', 'Your skills, in run order'), sub: D.skills_sub, html: s2 }];
};
P.playbook = function () {
  var who = (D.who || []).map(function (w) {
    var p = w.post || {};
    return '<div class="wr" data-a="card"><a' + link(p.url) + '>' + thumb(p, true) + '</a><div><h4>' + esc(w.line) + '</h4><p>' + esc(w.proof) + '</p></div><div class="num">' + (p.views != null ? '<span class="px">' + num(p.views) + '</span>views' : '') + '</div></div>';

    { key: 'who', title: T('who', 'Who you make for'), sub: D.who_sub, html: who },

      var a = eo(Math.min(1, Math.max(0, (t - s1) / .3))), m = eio(Math.min(1, Math.max(0, (t - 2.1) / .5)));
      el.style.opacity = (a * (find ? 1 : 1 - .72 * m)).toFixed(3);
      el.style.transform = 'translateY(' + (find ? -8 * m : 0).toFixed(2) + 'px) scale(' + (.94 + .06 * a).toFixed(4) + ')';
      if (b) { b.style.opacity = m; b.style.transform = 'scale(' + (.9 + .1 * m) + ')'; }
    });
  });
}
/* content-log: bars grow, the median line draws, the best bar's multiple turns orange */
function layoutBars() {
  var plot = $('.plot'); if (!plot) return;
  var b0 = $('.bc', plot), H = plot.clientHeight, base = b0 ? $('.bt', b0).offsetHeight + 8 + $('.bl', b0).offsetHeight + 7 + $('.bd', b0).offsetHeight : 24, head = 14, room = H - base - head;
  $$('.bc', plot).forEach(function (b) { b.dataset.h = Math.max(3, Number(b.dataset.f) * room).toFixed(1); var bar = $('.bar', b); if (!bar.style.height || bar.dataset.done) bar.style.height = b.dataset.h + 'px'; });
  $$('.gl', plot).forEach(function (g) { g.style.bottom = (base + Number(g.dataset.f) * room) + 'px'; });
}
function barsAnim(track, inView) {
  var plot = $('.plot'); if (!plot || !inView(plot)) { $$('.best-c').forEach(function (l) { l.classList.add('best'); }); return; }
  $$('.bc', plot).forEach(function (b, i) {
    var bar = $('.bar', b), lab = $('.bl', b), th = $('.bt', b);
    track(b, 1.0 + i * .045, .55, function (p) { var e = eo(p); bar.style.height = (Number(b.dataset.h) * e).toFixed(1) + 'px'; bar.dataset.done = p >= 1 ? '1' : ''; lab.style.opacity = th.style.opacity = p >= 1 ? '' : Math.min(1, p * 2.5); });
  });
  var med = $('.gl.med'); if (med) track(med, 1.55, .6, function (p) { med.style.right = p >= 1 ? '' : ((1 - eio(p)) * 100).toFixed(2) + '%'; });
  $$('.best-c').forEach(function (l) { track(l, 2.45, .2, function (p) { l.classList.toggle('best', p >= 1); }); });
}

/* render */
function render() {
  var app = $('#app');
  var page = P[D.page];
  if (!page) { app.innerHTML = '<p class="empty">No data in this page yet. Copy page.html and replace the JSON block in &lt;script id="data"&gt;.</p>'; return; }
  var secs = page();
  document.title = D.doc_title || [D.title, D.title_pixel].filter(Boolean).join(' ');
  var words = function (s) { return String(s || '').split(/\s+/).filter(Boolean).map(function (w) { return '<span class="w">' + esc(w) + '</span>'; }).join(' '); };
  var ctrs = (D.counters || []).slice(0, 4), anyAcc = ctrs.some(function (c) { return c.accent; });
  var hero = '<header class="hero"><h1><span class="l1">' + words(D.title) + '</span>' + (D.title_pixel ? '<span class="l2">' + words(D.title_pixel) + '</span>' : '') + '</h1>' +
    (D.lede ? '<p class="lede">' + esc(D.lede) + '</p>' : '') +
    (ctrs.length ? '<div class="ctrs">' + ctrs.map(function (c, i) {
      var acc = c.accent || (!anyAcc && i === ctrs.length - 1);
      var sfx = c.suffix === '×' ? '<span class="xs">×</span>' : esc(c.suffix || '');
      return '<div class="ctr"><span class="n px' + (acc ? ' acc' : '') + '" data-v="' + Number(c.value) + '" data-d="' + (c.decimals || 0) + '" data-s="' + esc(c.suffix || '') + '" data-pre="' + esc(c.prefix || '') + '" data-acc="' + (acc ? 1 : 0) + '">' + esc(c.prefix || '') + num(c.value, c.decimals || 0) + sfx + '</span><span class="lab">' + esc(c.label) + '</span></div>';
    }).join('') + '</div>' : '') + heroExtra + '</header>';
  var navItems = [];
  secs.forEach(function (s) { if (s.nav) s.nav.forEach(function (n) { navItems.push('<li><a href="#s-' + s.key + '" data-view="' + n.view + '" data-s="' + s.key + '"><span class="k">' + (navItems.length + 1) + '</span>' + esc(n.label) + '</a></li>'); }); else navItems.push('<li><a href="#s-' + s.key + '" data-s="' + s.key + '"><span class="k">' + (navItems.length + 1) + '</span>' + esc(s.navl || s.title) + '</a></li>'); });
  var nav = secs.length > 1 || (secs[0] && secs[0].nav) ? '<nav class="nav" aria-label="Sections"><ol>' + navItems.join('') + '</ol></nav>' : '';
  var main = '<main>' + secs.map(function (s, i) {
    return '<section class="sec" id="s-' + s.key + '"><h2><span class="k">' + (i + 1) + '</span>' + esc(s.title) + '</h2>' + (s.sub ? '<p class="sub">' + esc(s.sub) + '</p>' : '') + '<div class="body">' + s.html + '</div>' + (s.note ? '<p class="note">' + esc(s.note) + '</p>' : '') + '</section>';
  }).join('') + '</main>';
  var nx = D.next || {};
  var rc = D.receipt && D.receipt.length ? 'Read from Vamos on ' + dt(D.as_of, true) + ' · ' + D.receipt.map(esc).join(' · ') : (D.as_of ? 'Read from Vamos on ' + dt(D.as_of, true) : '');
  var foot = '<footer>' + (nx.command ? '<div class="nx"><p>Next: <code class="cmd">' + esc(nx.command) + '</code> ' + esc(nx.says || '') + '</p><button class="btn" type="button">Copy</button></div>' : '') +
    '<div class="foot"><span class="rc">' + rc + '</span>' + (still && reduced ? '' : '<button class="replay" type="button">Replay</button>') + (D.sample ? '<span class="sample">' + esc(D.sample) + '</span>' : '') + '</div></footer>';
  app.innerHTML = hero + nav + main + foot;
  if (after) after();
}

function wire() {
  var btn = $('.nx .btn');
  if (btn) btn.addEventListener('click', function () {
    var code = $('.nx .cmd'), text = code.textContent, done = function (ok) { btn.textContent = ok ? 'Copied' : 'Press ⌘C'; setTimeout(function () { btn.textContent = 'Copy'; }, 1800); };
    var sel = function () { var r = document.createRange(); r.selectNodeContents(code); var s = getSelection(); s.removeAllRanges(); s.addRange(r); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} done(ok); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, sel); else sel(); } catch (e) { sel(); }
  });
  $$('.pl-paste .btn').forEach(function (b) {
    var code = $('.pl-prompt', b.parentNode), label = b.textContent;
    b.addEventListener('click', function () {
      var done = function (ok) { b.textContent = ok ? 'Copied' : 'Press ⌘C'; setTimeout(function () { b.textContent = label; }, 1800); };
      var sel = function () { var r = document.createRange(); r.selectNodeContents(code); var s = getSelection(); s.removeAllRanges(); s.addRange(r); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} done(ok); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code.textContent).then(function () { done(true); }, sel); else sel(); } catch (e) { sel(); }
    });
  });
  var key = 'vamos-week-' + (D.title || '') + (D.as_of || '');
  var saved = {}; try { saved = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  $$('.week li').forEach(function (li) { if (saved[li.dataset.i]) li.classList.add('done'); $('.box', li).addEventListener('click', function () { li.classList.toggle('done'); saved[li.dataset.i] = li.classList.contains('done'); try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) {} }); });
  var links = $$('.nav a[data-s]');
  if (links.length && 'IntersectionObserver' in window) {
    var on = function (k) { links.forEach(function (a) { a.classList.toggle('on', a.dataset.s === k && (!a.dataset.view || a.dataset.view === (($('.seg [aria-pressed="true"]') || {}).dataset || {}).view)); }); };
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) on(e.target.id.slice(2)); }); }, { rootMargin: '-35% 0px -60% 0px' });
    $$('.sec').forEach(function (s) { io.observe(s); });
    on(links[0].dataset.s);
    document.addEventListener('click', function (e) { if (e.target.closest('.seg button,.nav a')) setTimeout(function () { var a = $('.nav a.on'); on(a ? a.dataset.s : links[0].dataset.s); }, 0); });
  }
  /* one example plays at a time, only while on screen */
  var vids = $$('video[data-src]'), vis = new Map(), cur = null;
  function fail(v) { v.dataset.failed = '1'; var th = v.parentNode, a = th.parentNode; if (v.poster) th.insertAdjacentHTML('afterbegin', img(v.poster)); else { th.classList.add('none'); th.insertAdjacentHTML('afterbegin', '<span class="tx">' + esc(th.dataset.hook) + '</span>'); } v.remove(); th.insertAdjacentHTML('afterend', '<span class="watch">Watch on ' + esc(v.dataset.plat) + ' ↗</span>'); if (cur === v) cur = null; }
  function pick() {
    if (cur && (vis.get(cur) || 0) >= .5) return;
    if (cur) cur.pause();
    cur = null; var br = .5;
    vis.forEach(function (r, v) { if (!v.dataset.failed && r >= br) { br = r; cur = v; } });
    if (cur) { if (!cur.getAttribute('src')) cur.src = cur.dataset.src; var pr = cur.play(); if (pr && pr.catch) pr.catch(function () {}); }
  }
  vids.forEach(function (v) {
    v.addEventListener('error', function () { fail(v); });
  });
  if (!still && vids.length && 'IntersectionObserver' in window) {
    var vio = new IntersectionObserver(function (es) { es.forEach(function (e) { vis.set(e.target, e.isIntersecting ? e.intersectionRatio : 0); }); pick(); }, { threshold: [0, .5, .75, 1] });
    vids.forEach(function (v) { vio.observe(v); });
  }
  document.addEventListener('error', function (e) {
    var t = e.target; if (!t || t.tagName !== 'IMG') return;
    if (t.classList.contains('av')) { t.remove(); return; }
    var th = t.closest('.th');
    if (th && th.dataset.hook != null && !t.closest('.bc,.cell,.wr,.rr,.hr-th')) { th.classList.add('none'); t.remove(); th.insertAdjacentHTML('afterbegin', '<span class="tx">' + esc(th.dataset.hook) + '</span>'); return; }
    t.style.visibility = 'hidden';
  }, true);
}

var raf = 0, curT = END, started = false;
function play() {
  if (still) { seek(END); return; }
  cancelAnimationFrame(raf); var t0 = performance.now();
  var step = function (now) { var t = (now - t0) / 1000; curT = Math.min(t, END); seek(curT); if (t < END) raf = requestAnimationFrame(step); };
  raf = requestAnimationFrame(step);
}
function whenSeen(cb) {
  var hero = $('.hero'), seen = false;
  var check = function () { if (!started && seen && document.visibilityState === 'visible') { started = true; cb(); } };
  if (!hero || !('IntersectionObserver' in window)) { started = true; cb(); return; }
  new IntersectionObserver(function (es) { seen = es.some(function (e) { return e.isIntersecting; }); check(); }).observe(hero);
  document.addEventListener('visibilitychange', check);
}
window.seek = function (t) { cancelAnimationFrame(raf); curT = Math.max(0, Math.min(END, Number(t) || 0)); seek(curT); };
window.PAGE_END = END;

try {
  render(); wire();
  var go = function () {
    buildTracks();
    seek(still ? END : 0);
    root.classList.remove('pre');
    whenSeen(play);
    var rp = $('.replay'); if (rp) rp.addEventListener('click', function () { if (reduced) return; still = false; buildTracks(); seek(0); play(); });
    window.addEventListener('hashchange', function () { if (/still/.test(location.hash)) { cancelAnimationFrame(raf); seek(END); } });
    var rt = 0; window.addEventListener('resize', function () { cancelAnimationFrame(rt); rt = requestAnimationFrame(function () { if (sorterLayout) sorterLayout(); layoutBars(); tracks.forEach(function (k) { k.p = -1; }); seek(curT); }); });
  };
  var timeout = new Promise(function (r) { setTimeout(r, 700); });
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), timeout]).then(go, go);
} catch (e) {
  root.classList.remove('pre');
  if (window.console) console.error(e);
}
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vamos</title>
<style>
:root{--bg:#faf9f5;--card:#ffffff;--ink:#1f1e1d;--ink2:#5e5d59;--muted:#87867f;--line:rgba(31,30,29,.12);--line2:rgba(31,30,29,.22);--track:rgba(31,30,29,.06);--accent:#e8501c;--quiet:#b7b3a9;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262624;--card:rgba(245,244,239,.035);--ink:#f5f4ef;--ink2:#c2c0b6;--muted:#8f8d86;--line:rgba(245,244,239,.12);--line2:rgba(245,244,239,.22);--track:rgba(245,244,239,.07);--accent:#ee6233;--quiet:#64615b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#262624;--card:rgba(245,244,239,.035);--ink:#f5f4ef;--ink2:#c2c0b6;--muted:#8f8d86;--line:rgba(245,244,239,.12);--line2:rgba(245,244,239,.22);--track:rgba(245,244,239,.07);--accent:#ee6233;--quiet:#64615b;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
main{max-width:760px;margin:0 auto;padding:40px 16px 56px}
@media (min-width:640px){main{padding:56px 24px 72px}}
h1,h2,h3,p,ul,ol,dl,figure{margin:0}
h1{font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.015em}
.lede{margin-top:12px;font-size:16px;color:var(--ink2);max-width:62ch}
section{margin-top:44px}
h2{font-size:16px;line-height:1.4;font-weight:600}
h3{font-size:15px;line-height:1.45;font-weight:600}
.note{margin-top:2px;font-size:13px;color:var(--muted)}
section>h2+*,section>.note+*{margin-top:16px}
p+p,p+ul,p+ol,ul+p,ol+p{margin-top:10px}
ul,ol{padding-left:20px}
li+li{margin-top:6px}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--line2);outline-offset:2px;border-radius:4px}
img{display:block;max-width:100%}
.muted{color:var(--muted)}
.hit{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:12px;line-height:1.5;font-weight:500;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:0 8px;vertical-align:1px}
.out{font-size:12.5px;font-weight:500;white-space:nowrap}
code{font:.9em var(--mono);background:var(--track);border-radius:5px;padding:1px 5px}
/* figures: a few numbers side by side */
.figs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;margin-top:24px}
.fig{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;min-width:0}
.fig span{display:block;font-size:12.5px;line-height:1.35;color:var(--muted)}
.fig b{display:block;font-size:24px;line-height:1.3;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@media (max-width:560px){.figs{gap:6px}.fig{padding:10px}.fig span{font-size:11.5px}.fig b{font-size:19px}}
/* ranked rows, each with a bar */
.rows{border-top:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row>img{flex:none;width:36px;aspect-ratio:9/16;object-fit:cover;border-radius:6px;background:var(--track)}
.row .main{flex:1;min-width:0}
.row .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:500;line-height:1.4}
.row .m{display:block;font-size:12.5px;color:var(--muted)}
.row .v{flex:none;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.row .v small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
a.row:hover .t{text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.bar{display:block;max-width:240px;height:6px;margin-top:6px;border-radius:3px;background:var(--track)}
.bar i{display:block;height:100%;min-width:3px;border-radius:3px;background:var(--quiet)}
.bar.hit i{background:var(--accent)}
/* posts that link out */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:18px 12px}
.post{display:flex;flex-direction:column;gap:6px;min-width:0;text-decoration:none}
.post img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:var(--track)}
.post .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:500;line-height:1.4}
.post .m{font-size:12px;color:var(--muted)}
/* a block for one play, format or finding */
.card{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px 18px}
.card+.card{margin-top:12px}
.card>*+*{margin-top:10px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;color:var(--ink2)}
@media (max-width:480px){.kv{grid-template-columns:minmax(0,1fr);gap:0}.kv dd+dt{margin-top:6px}}
/* a line to copy */
.copy{display:flex;gap:12px;align-items:flex-start;background:var(--track);border-radius:10px;padding:10px 12px}
.copy p{flex:1;min-width:0;margin:0;font-size:14px;line-height:1.55;color:var(--ink2);white-space:pre-wrap}
@media (max-width:480px){.copy{flex-direction:column;gap:8px}.copy button{align-self:flex-end}}
.copy button{flex:none;font:500 12.5px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;cursor:pointer}
/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:500;color:var(--muted);padding:0 12px 8px 0}
td{padding:9px 12px 9px 0;border-top:1px solid var(--line);vertical-align:top}
/* footer: what was read, when, and what's next */
.foot{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.foot p+p{margin-top:4px}
</style>
</head>
<body>
<main>

<script>
document.querySelectorAll('img').forEach(function (i) { function gone() { i.remove(); } i.addEventListener('error', gone); if (i.complete && !i.naturalWidth && i.loading !== 'lazy') gone(); });
document.addEventListener('click', function (e) {
  var b = e.target.closest('.copy button'); if (!b) return;
  var p = b.parentNode.querySelector('p');
  function done(ok) { b.textContent = ok ? 'Copied' : 'Press ⌘C'; setTimeout(function () { b.textContent = 'Copy'; }, 1500); }
  function select() { var r = document.createRange(); r.selectNodeContents(p); var s = getSelection(); s.removeAllRanges(); s.addRange(r); var ok = false; try { ok = document.execCommand('copy'); } catch (x) {} done(ok); }
  try { navigator.clipboard.writeText(p.innerText).then(function () { done(true); }, select); } catch (x) { select(); }
});
</script>
</body>
</html>
